## 🚀 Quick Start — New Project

\`\`\`bash
npx create-expo-app@latest my-app
cd my-app
npm run reset-project
\`\`\`

Then set up the folder structure:

\`\`\`bash
mkdir assets/audio assets/fonts assets/icons
mkdir auth components constants hooks lib store dummy-data types utils
touch .env
\`\`\`

---

## 🔧 Common Workflows

### Development Build

\`\`\`bash
npx expo prebuild --clean
npx expo run:android
npx expo start --dev-client
\`\`\`

### Production Build & Submit

\`\`\`bash
eas build --platform android --profile production
eas submit --platform android
\`\`\`

### OTA Update

\`\`\`bash
eas update --channel production --message "Release notes here"
\`\`\`

## 🧠 Architecture Patterns

This documentation covers several key architectural decisions:

- **Auth**: Session token in SecureStore, access token in Zustand (memory), auto-refresh with subscriber queue
- **State**: Zustand for global state, TanStack Query for server state
- **Routing**: Expo Router with file-based routing, typed routes, route groups
- **Styling**: NativeWind (TailwindCSS) utility classes
- **API**: \`fetchWithAuth\` wrapper with automatic 401 handling and token refresh

## 🔧 Setup & Configuration

\`\`\`bash
# Login to your Expo account
eas login

# Logout
eas logout

# Check who is logged in
eas whoami

# Initialize EAS in your project (creates eas.json)
eas build:configure
\`\`\`

---

## 🏗️ Build

\`\`\`bash
# Build for Android (uses "production" profile by default)
eas build --platform android

# Build for iOS
eas build --platform ios

# Build for both platforms
eas build --platform all

# Build using a specific profile
eas build --platform android --profile development
eas build --platform android --profile preview
eas build --platform android --profile production

# Build locally (on your machine, not EAS servers)
eas build --platform android --local

# List all previous builds
eas build:list

# Check build status/details
eas build:view
\`\`\`

---

## 🚀 Submit (Upload to Store)

\`\`\`bash
# Submit Android build to Google Play Store
eas submit --platform android

# Submit iOS build to Apple App Store
eas submit --platform ios

# Submit a specific build by ID
eas submit --platform android --id <build-id>
\`\`\`

         "pages/expo-env-variables.md": `# Expo Android Build — Environment Variables Guide

## Overview

There are three ways to manage environment variables in an Expo project, depending on the stage:

| Stage | Method |
|---|---|
| Local development | \`.env\` file with \`EXPO_PUBLIC_\` prefix |
| EAS Build (dev/prod) | \`eas.json\` under the \`env\` block |
| Sensitive secrets | EAS Secrets via CLI |

---

## 1. Local Development — \`.env\` File

For local development (\`expo start\` or \`npx expo run:android\`), create a \`.env.local\` file in your project root. All variables **must be prefixed with \`EXPO_PUBLIC_\`** to be accessible in your app's JavaScript code.

\`\`\`env
# .env.local
EXPO_PUBLIC_API_URL=https://dev.api.example.com
EXPO_PUBLIC_STRIPE_KEY=pk_test_xxx
\`\`\`

Access them in your code like this:

\`\`\`js
const apiUrl = process.env.EXPO_PUBLIC_API_URL;
console.log(apiUrl); // https://dev.api.example.com
\`\`\`

> ⚠️ **Important:** Variables with the \`EXPO_PUBLIC_\` prefix are **bundled into the app** and visible to end users. Never store private keys or secrets here.

---

## 2. EAS Build — \`eas.json\`

For cloud builds via EAS, define your environment variables inside \`eas.json\` under each build profile's \`env\` block. These are injected at build time.

\`\`\`json
{
  "build": {
    "development": {
      "android": {
        "buildType": "apk"
      },
      "env": {
        "EXPO_PUBLIC_API_URL": "https://dev.api.example.com",
        "EXPO_PUBLIC_APP_ENV": "development"
      }
    },
    "production": {
      "env": {
        "EXPO_PUBLIC_API_URL": "https://api.example.com",
        "EXPO_PUBLIC_APP_ENV": "production"
      }
    }
  }
}
\`\`\`

Run the build for a specific profile:

\`\`\`bash
# Development build
eas build --platform android --profile development

# Production build
eas build --platform android --profile production
\`\`\`

---

## 3. Sensitive Secrets — EAS Secrets

For sensitive values (API keys, tokens, passwords) that you **don't want committed to your repository**, use EAS Secrets. These are stored encrypted on Expo's servers and injected at build time — same as \`eas.json\` env vars, but secure.

**Create a secret via the CLI:**

\`\`\`bash
eas secret:create --scope project --name MY_SECRET_KEY --value "your-secret-value"
\`\`\`

**List existing secrets:**

\`\`\`bash
eas secret:list
\`\`\`

**Delete a secret:**

\`\`\`bash
eas secret:delete --name MY_SECRET_KEY
\`\`\`

Once created, the secret is automatically available during EAS builds as an environment variable — no additional configuration needed.

---

## Putting It All Together

A typical project structure looks like this:

\`\`\`
my-expo-app/
├── .env.local          # Local dev variables (gitignored)
├── .gitignore
├── eas.json            # Build profiles + non-secret env vars
├── app.json
└── app/
    └── index.tsx
\`\`\`

**.gitignore** — make sure your \`.env\` files are excluded:

\`\`\`
.env
.env.local
.env*.local
\`\`\`

**Example usage in code** that works across all environments:

\`\`\`js
// works locally, in EAS dev build, and in production
const API_URL = process.env.EXPO_PUBLIC_API_URL;
const APP_ENV = process.env.EXPO_PUBLIC_APP_ENV;

console.log(\`Running in \${APP_ENV} — connecting to \${API_URL}\`);
\`\`\`

---

## Quick Reference

| Variable type | Visible to users? | Committed to repo? | Where to define |
|---|---|---|---|
| \`EXPO_PUBLIC_*\` (local) | ✅ Yes | ❌ No (gitignored) | \`.env.local\` |
| \`EXPO_PUBLIC_*\` (build) | ✅ Yes | ✅ Yes | \`eas.json\` |
| Secrets | ❌ No | ❌ No | EAS Secrets (CLI) |`,

## 3. Prebuild & Running the App

Prebuild generates the native \`android/\` and \`ios/\` folders from your Expo config.

\`\`\`bash
# Ensure that the device is connected
adb devices

# Clean prebuild (recommended when changing native config)
npx expo prebuild --clean

# Install app
npx expo run:android # You can unplug the usb after this

# Start the dev server only (Every time after installing app - step 3)
npx expo start --dev-client
\`\`\`

> Full docs: https://docs.expo.dev/workflow/continuous-native-generation/

> **Note:** After every change to \`app.json\`, \`package.json\` plugins, or native dependencies, re-run \`npx expo prebuild --clean\` and rebuild the app.

## 4. Google OAuth

### Prerequisites

- Follow YouTube Example [YouTube Example](https://www.youtube.com/watch?v=Hbru5P1Uxg0&pp=ygUjR29vZ2xlIHNpZ24gaW4gd2loIGVhY3QgTmF0aXZlIEV4cG8%3D)
- A project on [Google Cloud Console](https://console.cloud.google.com/auth)
- A debug/release keystore SHA-1 fingerprint (Android)
- A Bundle ID (iOS)

### Get the SHA-1 Fingerprint (Android)

\`\`\`bash
# Debug keystore (default path)
keytool -keystore ./android/app/debug.keystore -list -v

# Production keystore
keytool -keystore path/to/your/production.keystore -list -v
\`\`\`

- **Default password:** \`android\`
- **Default key alias:** \`androiddebugkey\`
- Copy the \`SHA1\` value into your Google Cloud Console OAuth client (Android).

### Google Cloud Console Setup

1. Go to **APIs & Services > Credentials > Create Credentials > OAuth Client ID**
2. Create two clients:
- **Android** — enter your package name (e.g. \`com.yourname.app\`) and SHA-1
- **Web** — used as the \`webClientId\` in your app
3. For iOS, create an **iOS** client and enter your Bundle ID

### Install the Library

\`\`\`bash
npx expo install @react-native-google-signin/google-signin
\`\`\`

> Full docs: https://react-native-google-signin.github.io/

### Usage

\`\`\`tsx
import {
GoogleSignin,
GoogleSigninButton,
statusCodes,
} from "@react-native-google-signin/google-signin";
import { useEffect } from "react";

// Configure once (e.g. in _layout.tsx or App.tsx)
GoogleSignin.configure({
webClientId: "YOUR_WEB_CLIENT_ID.apps.googleusercontent.com",
});

export default function SignInScreen() {
const signIn = async () => {
try {
await GoogleSignin.hasPlayServices();
const userInfo = await GoogleSignin.signIn();
console.log(userInfo);
} catch (error: any) {
if (error.code === statusCodes.SIGN_IN_CANCELLED) {
console.log("User cancelled sign-in");
} else if (error.code === statusCodes.IN_PROGRESS) {
console.log("Sign-in already in progress");
} else {
console.error(error);
}
}
};

return <GoogleSigninButton onPress={signIn} />;
}
\`\`\`

## 5. Custom Fonts

### Step 1 — Add Font Files

Place your \`.ttf\` or \`.otf\` files in \`assets/fonts/\`:

\`\`\`
assets/
└── fonts/

## 7. File-Based Routing

Expo Router uses the file system to define routes, similar to Next.js.

### Dynamic Routes

Create a file named \`[id].tsx\` inside the \`app/\` folder:

\`\`\`tsx
// app/post/[id].tsx
import { useLocalSearchParams } from "expo-router";
import { Text, View } from "react-native";

export default function PostScreen() {
const { id } = useLocalSearchParams();

return (
<View>
<Text>Post ID: {id}</Text>
</View>
);
}
\`\`\`

### Route Groups (No URL Segment)

Use parentheses to group routes without affecting the URL:

\`\`\`
app/
├── (auth)/
│   ├── login.tsx      → /login
│   └── register.tsx   → /register
└── (tabs)/
├── index.tsx      → /
└── profile.tsx    → /profile
\`\`\`

---

## 8. Navigation & Params

### Navigate to a Route

\`\`\`tsx
import { router } from "expo-router";

// Basic navigation
router.push("/page2");

// With params
router.push({ pathname: "/page2", params: { from: "Home", userId: "123" } });

// Replace current screen (no back button)
router.replace("/login");

// Go back
router.back();
\`\`\`

### Read Params on the Destination Page

\`\`\`tsx
import { useLocalSearchParams } from "expo-router";

export default function Page2() {
const { from, userId } = useLocalSearchParams();

return <Text>Came from: {from}</Text>;
}
\`\`\`

### Typed Routes (Recommended)

Enable typed routes in \`app.json\` for autocomplete and safety:

\`\`\`json
{
"expo": {
"experiments": {
"typedRoutes": true
}
}
}
\`\`\`

---

## 9. Layouts & Slots

Use \`<Slot />\` in a layout file when you want to wrap screens with shared UI like a \`Header\` or \`Footer\` without replacing the navigator.

\`\`\`tsx
// app/_layout.tsx
import { Slot } from "expo-router";
import { View } from "react-native";
import Header from "@/components/Header";
import Footer from "@/components/Footer";

export default function RootLayout() {
return (
<View style={{ flex: 1 }}>
<Header />
<Slot /> {/* Child screen renders here */}
<Footer />
</View>
);
}
\`\`\`

> **\`<Stack>\`** replaces the child with a full stack navigator.
> **\`<Slot>\`** just renders the matched child screen in place — useful when you want full control of the layout.

## 10. Image Picker

### Install

\`\`\`bash
npx expo install expo-image-picker
\`\`\`

### Add Permission to \`app.json\`

\`\`\`json
{
"expo": {
"plugins": [
[
"expo-image-picker",
{
 "photosPermission": "Allow $(PRODUCT_NAME) to access your photos.",
 "cameraPermission": "Allow $(PRODUCT_NAME) to use the camera."
}
]
]
}
}
\`\`\`

### Usage

\`\`\`tsx
import * as ImagePicker from "expo-image-picker";
import { Button, Image, View } from "react-native";
import { useState } from "react";

export default function ImagePickerScreen() {
const [image, setImage] = useState<string | null>(null);

const pickImage = async () => {
const result = await ImagePicker.launchImageLibraryAsync({
mediaTypes: ImagePicker.MediaTypeOptions.Images,
allowsEditing: true,
aspect: [4, 3],
quality: 1,
});

if (!result.canceled) {
setImage(result.assets[0].uri);
}
};

const takePhoto = async () => {
const permission = await ImagePicker.requestCameraPermissionsAsync();
if (!permission.granted) return;

const result = await ImagePicker.launchCameraAsync({
allowsEditing: true,
quality: 1,
});

if (!result.canceled) {
setImage(result.assets[0].uri);
}
};

return (
<View>
<Button title="Pick from Library" onPress={pickImage} />
<Button title="Take Photo" onPress={takePhoto} />
{image && (
<Image source={{ uri: image }} style={{ width: 200, height: 200 }} />
)}
</View>
);
}
\`\`\`

## 11. Push Notifications

### Build with EAS First

\`\`\`bash
npm install -g eas-cli
eas build --platform android
\`\`\`

---

### Android Setup (Firebase Cloud Messaging — FCM V1)

#### Step 1 — Create a Firebase Project

1. Go to [Firebase Console](https://console.firebase.google.com)
2. Click **Add Project** and follow the steps
3. Register your Android app using your package name (e.g. \`com.yourname.app\`)
4. Download the \`google-services.json\` file

#### Step 2 — Generate a Firebase Service Account Key

1. In Firebase, go to **Project Settings > Service Accounts**
2. Click **Generate new private key** and download the JSON file

#### Step 3 — Upload to Expo Credentials

1. In the [Expo dashboard](https://expo.dev), open your project
2. Go to **Credentials > Android**
3. Upload the downloaded key to **FCM V1 Service Account Key**

#### Step 4 — Add \`google-services.json\` to Your Project

Place the file in the root or any directory, then reference it in \`app.json\`:

\`\`\`json
{
"expo": {
"android": {
"googleServicesFile": "./google-services.json",
"package": "com.yourname.app"
}
}
}
\`\`\`

#### Step 5 — Install the Notifications Library

\`\`\`bash
npx expo install expo-notifications expo-device
\`\`\`

#### Step 6 — Request Permission & Get Push Token

\`\`\`tsx
import * as Notifications from "expo-notifications";
import * as Device from "expo-device";
import { useEffect } from "react";
import { Platform } from "react-native";

Notifications.setNotificationHandler({
handleNotification: async () => ({
shouldShowAlert: true,
shouldPlaySound: true,
shouldSetBadge: false,
}),
});

export async function registerForPushNotificationsAsync(): Promise<
string | null
> {
if (!Device.isDevice) {
alert("Must use a physical device for push notifications");
return null;
}

const { status: existingStatus } = await Notifications.getPermissionsAsync();
let finalStatus = existingStatus;

if (existingStatus !== "granted") {
const { status } = await Notifications.requestPermissionsAsync();
finalStatus = status;
}

if (finalStatus !== "granted") {
alert("Permission not granted for push notifications!");
return null;
}

const token = (await Notifications.getExpoPushTokenAsync()).data;
console.log("Expo Push Token:", token);

if (Platform.OS === "android") {
await Notifications.setNotificationChannelAsync("default", {
name: "default",
importance: Notifications.AndroidImportance.MAX,
});
}

return token;
}
\`\`\`

---

### iOS Setup

1. An Apple Developer account is required
2. EAS will automatically handle APNs certificates when you run \`eas build --platform ios\`
3. Add the following to \`app.json\`:

\`\`\`json
{
"expo": {
"ios": {
"bundleIdentifier": "com.yourname.app"
}
}
}
\`\`\`

"pages/auth-setup.md": `# Auth Setup — React Native (Dosify)

## Files

| File | Role |
|---|---|
| \`auth/authHelper.ts\` | Token validation, SecureStore helpers, refresh logic |
| \`store/authStore.ts\` | Global auth state (Zustand) |
| \`components/AuthInitializer.tsx\` | Runs \`initializeAuth\` on app mount |
| \`utils/fetchWithAuth.ts\` | Authenticated fetch wrapper — handles 401s with auto-refresh |
| \`utils/Provider.tsx\` | Wraps app with QueryClientProvider + AuthInitializer |

---

## How It Works

### 1. Login

After a successful login request, the backend returns:

\`\`\`json
{
"success": true,
"message": "Login successful",
"accessToken": "<jwt>",
"sessionToken": "<jwt>",
"user": { ... }
}
\`\`\`

Call \`loginSuccess(accessToken, sessionToken, user)\` from the auth store. This:
- Saves the \`sessionToken\` to **SecureStore** (encrypted on-device storage)
- Stores the \`accessToken\` and \`user\` in Zustand state (in-memory)
- Sets \`isLoggedIn: true\`

The \`accessToken\` is short-lived (used for API requests). The \`sessionToken\` is long-lived (used only to refresh the access token).

---

### 2. Making Authenticated Requests

Use \`fetchWithAuth\` from \`utils/fetchWithAuth.ts\` instead of raw \`fetch\`. It reads the access token from the store automatically, and handles expiry transparently:

\`\`\`ts
import { fetchWithAuth } from "@/utils/fetchWithAuth";

const res = await fetchWithAuth(api.some.endpoint);
const res = await fetchWithAuth(api.some.endpoint, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify(payload),
});
\`\`\`

On a 401 response, \`fetchWithAuth\` will:
1. Call \`refreshCredentials()\` to silently get a new access token
2. Retry the original request with the new token
3. If the refresh fails, call \`logout()\` and return the 401 response

> Do **not** manually attach \`Authorization\` headers or read \`accessToken\` from the store for API calls — use \`fetchWithAuth\` for all authenticated requests.

---

### 3. Token Refresh (\`refreshCredentials\`)

Called automatically by \`fetchWithAuth\` and during app startup — you should not need to call this directly. It:
1. Reads the \`sessionToken\` from SecureStore
2. Sends a \`POST /auth/mobile-refresh-token\` request with \`Authorization: Bearer <sessionToken>\`
3. Saves the rotated \`sessionToken\` returned in the response back to SecureStore
4. Returns a new \`accessToken\` (or \`null\` on failure)

A global lock (\`isRefreshing\`) prevents parallel refresh calls — concurrent calls queue up as subscribers and resolve once the single refresh completes. On failure, all queued subscribers are cleared and \`null\` is returned.

> **Why a separate mobile endpoint?** The web \`POST /auth/refresh-token\` reads the session token from an HttpOnly cookie (set automatically by the browser). Mobile clients have no cookie jar, so a dedicated endpoint reads it from the \`Authorization\` header instead and returns the new session token in the JSON body.

---

### 4. App Startup (\`initializeAuth\`)

\`AuthInitializer\` runs \`initializeAuth()\` once on mount. The flow:

1. If already logged in (state hydrated), exit early
2. Call \`refreshCredentials()\` — attempts a silent login using the stored \`sessionToken\`
3. If a valid \`accessToken\` comes back, fetch \`GET /users/me\` to rehydrate the user object
4. On success: set \`isLoggedIn: true\` with fresh user data
5. On failure (expired/missing session): clear SecureStore, reset state → user goes to login screen

This means users stay logged in across app restarts as long as their \`sessionToken\` is valid.

> Screens that render auth-dependent UI should gate on \`isAuthLoading\` from the auth store to avoid a flash of "Not Logged In" before \`initializeAuth\` completes:
> \`\`\`ts
> const { isLoggedIn, isLoading: isAuthLoading } = useAuthStore();
> if (isAuthLoading) return <LoadingScreen />;
> \`\`\`

---

### 5. Logout

\`logout()\`:
1. Reads \`sessionToken\` from SecureStore
2. Calls \`POST /auth/logout\` with \`Authorization: Bearer <sessionToken>\`
3. Deletes \`sessionToken\` from SecureStore
4. Resets all auth state in Zustand

---

## Storage Strategy

| Data | Where | Why |
|---|---|---|
| \`sessionToken\` | \`expo-secure-store\` | Encrypted, persists across restarts, never exposed to JS bundle |
| \`accessToken\` | Zustand (memory) | Short-lived, no need to persist — refreshed on each startup |
| \`user\` | Zustand (memory) | Re-fetched on startup to stay fresh |

> **Why not AsyncStorage?** SecureStore encrypts data using the device keychain (iOS) / Keystore (Android). AsyncStorage is plaintext — unsuitable for auth tokens.

---

## Key Difference from Web Version

| Concern | Web (Next.js) | React Native |
|---|---|---|
| Session persistence | HTTP-only cookie (browser) | \`expo-secure-store\` |
| Sending session on refresh | Cookie sent automatically | \`Authorization: Bearer <sessionToken>\` header |
| Refresh endpoint | \`POST /auth/refresh-token\` | \`POST /auth/mobile-refresh-token\` |
| New session token delivery | Set-Cookie header | JSON response body (\`sessionToken\`) |
| Dev checks | \`process.env.NODE_ENV\` | \`__DEV__\` |
| \`"use client"\` directives | Required for Next.js | Removed — not valid in RN |`

      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const burger = document.getElementById('burger');
      const output = document.getElementById('md-output');
      const loader = document.getElementById('loader');
      const navLinks = document.querySelectorAll('.nav-link');

      // ── Sidebar toggle (mobile) ──
      function openSidebar() {
         sidebar.classList.add('open');
         overlay.classList.add('visible');
         burger.classList.add('open');
      }
      function closeSidebar() {
         sidebar.classList.remove('open');
         overlay.classList.remove('visible');
         burger.classList.remove('open');
      }
      burger.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
      overlay.addEventListener('click', closeSidebar);

      // ── Sub-nav toggle ──
      function toggleSubNav(btn) {
         btn.classList.toggle('open');
         const sub = btn.nextElementSibling;
         if (sub && sub.classList.contains('sub-nav')) {
            sub.classList.toggle('open');
         }
      }

      // ── Load & render markdown ──
      function loadPage(src, linkEl) {
         // Active state
         navLinks.forEach(l => l.classList.remove('active'));
         linkEl.classList.add('active');

         // Loading indicator
         output.innerHTML = '';
         loader.style.display = 'block';

         const md = pages[src];
         if (!md) {
            loader.style.display = 'none';
            output.innerHTML = `
          <div class="placeholder">
            <span class="big">✕</span>
            <span>Page not found: <code>${src}</code></span>
          </div>`;
            closeSidebar();
            return;
         }

         loader.style.display = 'none';
         output.innerHTML = marked.parse(md);
         // Apply syntax highlighting to code blocks
         output.querySelectorAll('pre code').forEach(block => {
            hljs.highlightElement(block);
         });
         // Scroll to top
         document.querySelector('.main').scrollTo({ top: 0, behavior: 'smooth' });
         closeSidebar();
      }

      // ── Nav click handlers ──
      navLinks.forEach(link => {
         link.addEventListener('click', e => {
            e.preventDefault();
            loadPage(link.dataset.src, link);
         });
      });

      // ── Auto-load from URL hash ──
      function loadFromHash() {
         const hash = location.hash.replace('#', '');
         if (hash) {
            const match = [...navLinks].find(l => l.dataset.src === hash);
            if (match) { loadPage(match.dataset.src, match); return; }
         }
         // Default: load first page
         const first = navLinks[0];
         if (first) loadPage(first.dataset.src, first);
      }

      // Update hash on navigation
      navLinks.forEach(link => {
         link.addEventListener('click', () => {
            history.replaceState(null, '', '#' + link.dataset.src);
         });
      });

      loadFromHash();
      window.addEventListener('hashchange', loadFromHash);
   </script>
