<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>EXPO - React Native</title>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
   <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
   <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
   <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&display=swap"
      rel="stylesheet">

   <style>
      *,
      *::before,
      *::after {
         box-sizing: border-box;
         margin: 0;
         padding: 0;
      }

      :root {
         --bg: #0e0f11;
         --surface: #15171a;
         --surface2: #1c1f23;
         --border: #2a2d33;
         --accent: #5b8dee;
         --accent-soft: rgba(91, 141, 238, .12);
         --text: #d4d8e2;
         --text-muted: #6b7280;
         --text-strong: #f0f2f6;
         --sidebar-w: 260px;
         --header-h: 54px;
         --radius: 8px;
         --mono: 'JetBrains Mono', monospace;
         --serif: 'Crimson Pro', Georgia, serif;
         --transition: .22s cubic-bezier(.4, 0, .2, 1);
      }

      html,
      body {
         height: 100%;
         background: var(--bg);
         color: var(--text);
         font-family: var(--serif);
         font-size: 18px;
         line-height: 1.7;
      }

      /* ── Layout ── */
      .layout {
         display: flex;
         height: 100vh;
         overflow: hidden;
      }

      /* ── Mobile header ── */
      .topbar {
         display: none;
         position: fixed;
         top: 0;
         left: 0;
         right: 0;
         height: var(--header-h);
         background: var(--surface);
         border-bottom: 1px solid var(--border);
         align-items: center;
         padding: 0 16px;
         z-index: 200;
         gap: 14px;
      }

      .topbar-title {
         font-family: var(--mono);
         font-size: .85rem;
         color: var(--text-strong);
         letter-spacing: .05em;
      }

      .burger {
         background: none;
         border: none;
         cursor: pointer;
         display: flex;
         flex-direction: column;
         gap: 5px;
         padding: 4px;
         color: var(--text);
      }

      .burger span {
         display: block;
         width: 22px;
         height: 2px;
         background: var(--text);
         border-radius: 2px;
         transition: var(--transition);
      }

      .burger.open span:nth-child(1) {
         transform: translateY(7px) rotate(45deg);
      }

      .burger.open span:nth-child(2) {
         opacity: 0;
      }

      .burger.open span:nth-child(3) {
         transform: translateY(-7px) rotate(-45deg);
      }

      /* ── Overlay ── */
      .overlay {
         display: none;
         position: fixed;
         inset: 0;
         z-index: 150;
         background: rgba(0, 0, 0, .55);
         backdrop-filter: blur(2px);
         opacity: 0;
         transition: opacity var(--transition);
      }

      .overlay.visible {
         opacity: 1;
      }

      /* ── Sidebar ── */
      .sidebar {
         width: var(--sidebar-w);
         flex-shrink: 0;
         background: var(--surface);
         border-right: 1px solid var(--border);
         display: flex;
         flex-direction: column;
         overflow-y: auto;
         transition: transform var(--transition);
      }

      .sidebar-logo {
         padding: 28px 22px 20px;
         font-family: var(--mono);
         font-size: .78rem;
         font-weight: 600;
         letter-spacing: .1em;
         text-transform: uppercase;
         color: var(--accent);
         border-bottom: 1px solid var(--border);
         display: flex;
         align-items: center;
         gap: 10px;
      }

      .sidebar-logo .dot {
         width: 8px;
         height: 8px;
         background: var(--accent);
         border-radius: 50%;
         box-shadow: 0 0 8px var(--accent);
         animation: pulse 2.5s ease-in-out infinite;
      }

      @keyframes pulse {

         0%,
         100% {
            opacity: 1;
            transform: scale(1);
         }

         50% {
            opacity: .4;
            transform: scale(.7);
         }
      }

      .sidebar-section {
         padding: 20px 14px 10px;
         font-family: var(--mono);
         font-size: .65rem;
         letter-spacing: .15em;
         text-transform: uppercase;
         color: var(--text-muted);
      }

      .home-link {
         padding: 9px 14px;
         margin: 2px 8px;
         border-radius: var(--radius);
         text-decoration: none;
         color: var(--text);
         font-family: var(--mono);
         font-size: .82rem;
         cursor: pointer;
         transition: background var(--transition), color var(--transition), padding-left var(--transition);
         border: 1px solid transparent;
         position: relative;
      }

      .home-link:hover {
         background: var(--surface2);
         color: var(--text-strong);
         padding-left: 20px;
      }


      .nav-link {
         display: flex;
         align-items: center;
         gap: 10px;
         padding: 9px 14px;
         margin: 2px 8px;
         border-radius: var(--radius);
         text-decoration: none;
         color: var(--text);
         font-family: var(--mono);
         font-size: .82rem;
         cursor: pointer;
         transition: background var(--transition), color var(--transition), padding-left var(--transition);
         border: 1px solid transparent;
         position: relative;
      }

      .nav-link::before {
         content: '';
         width: 3px;
         height: 0;
         background: var(--accent);
         border-radius: 2px;
         position: absolute;
         left: 0;
         top: 50%;
         transform: translateY(-50%);
         transition: height var(--transition);
      }

      .nav-link:hover {
         background: var(--surface2);
         color: var(--text-strong);
         padding-left: 20px;
      }

      .nav-link:hover::before {
         height: 60%;
      }

      .nav-link.active {
         background: var(--accent-soft);
         color: var(--accent);
         border-color: rgba(91, 141, 238, .2);
         padding-left: 20px;
      }

      .nav-link.active::before {
         height: 60%;
      }

      .nav-link .icon {
         opacity: .5;
         font-size: .9rem;
      }

      /* ── Sub-nav (collapsible tree) ── */
      .nav-group {
         position: relative;
      }

      .nav-toggle {
         display: flex;
         align-items: center;
         gap: 10px;
         padding: 9px 14px;
         margin: 2px 8px;
         border-radius: var(--radius);
         font-family: var(--mono);
         font-size: .82rem;
         color: var(--text);
         cursor: pointer;
         transition: background var(--transition), color var(--transition);
         border: 1px solid transparent;
         background: none;
         width: calc(100% - 16px);
         text-align: left;
         position: relative;
      }

      .nav-toggle::before {
         content: '';
         width: 3px;
         height: 0;
         background: var(--accent);
         border-radius: 2px;
         position: absolute;
         left: 0;
         top: 50%;
         transform: translateY(-50%);
         transition: height var(--transition);
      }

      .nav-toggle:hover {
         background: var(--surface2);
         color: var(--text-strong);
      }

      .nav-toggle:hover::before {
         height: 60%;
      }

      .nav-toggle .icon {
         opacity: .5;
         font-size: .9rem;
      }

      .nav-toggle .arrow {
         margin-left: auto;
         font-size: .6rem;
         opacity: .4;
         transition: transform var(--transition);
      }

      .nav-toggle.open .arrow {
         transform: rotate(90deg);
      }

      .sub-nav {
         overflow: hidden;
         max-height: 0;
         transition: max-height .3s ease;
      }

      .sub-nav.open {
         max-height: 600px;
      }

      .sub-nav .nav-link {
         padding-left: 32px;
         font-size: .76rem;
      }

      .sub-nav .nav-link:hover {
         padding-left: 38px;
      }

      .sub-nav .nav-link.active {
         padding-left: 38px;
      }

      .sub-nav .sub-nav .nav-link {
         padding-left: 52px;
         font-size: .72rem;
      }

      .sub-nav .sub-nav .nav-link:hover {
         padding-left: 58px;
      }

      .sub-nav .sub-nav .nav-link.active {
         padding-left: 58px;
      }

      .sub-nav .nav-toggle {
         padding-left: 32px;
         font-size: .76rem;
      }

      .sub-nav .sub-nav .nav-toggle {
         padding-left: 52px;
         font-size: .72rem;
      }

      .sidebar-footer {
         margin-top: auto;
         padding: 16px 18px;
         border-top: 1px solid var(--border);
         font-family: var(--mono);
         font-size: .65rem;
         color: var(--text-muted);
         letter-spacing: .04em;
      }

      /* ── Main content ── */
      .main {
         flex: 1;
         overflow-y: auto;
         display: flex;
         flex-direction: column;
      }

      .content-wrap {
         max-width: 740px;
         width: 100%;
         margin: 0 auto;
         padding: 52px 48px 80px;
      }

      /* ── Loading / empty state ── */
      .placeholder {
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         height: 100%;
         gap: 16px;
         color: var(--text-muted);
         font-family: var(--mono);
         font-size: .85rem;
      }

      .placeholder .big {
         font-size: 2.5rem;
         opacity: .2;
      }

      .loader {
         width: 32px;
         height: 32px;
         border: 2px solid var(--border);
         border-top-color: var(--accent);
         border-radius: 50%;
         animation: spin .7s linear infinite;
         display: none;
      }

      @keyframes spin {
         to {
            transform: rotate(360deg);
         }
      }

      /* ── Markdown typography ── */
      #md-output {
         animation: fadeIn .35s ease;
      }

      @keyframes fadeIn {
         from {
            opacity: 0;
            transform: translateY(6px);
         }

         to {
            opacity: 1;
            transform: none;
         }
      }

      #md-output h1 {
         font-family: var(--serif);
         font-weight: 300;
         font-size: 2.6rem;
         color: var(--text-strong);
         line-height: 1.2;
         border-bottom: 1px solid var(--border);
         padding-bottom: 18px;
         margin-bottom: 28px;
         letter-spacing: -.02em;
      }

      #md-output h2 {
         font-family: var(--serif);
         font-weight: 600;
         font-size: 1.55rem;
         color: var(--text-strong);
         margin: 42px 0 14px;
         letter-spacing: -.01em;
      }

      #md-output h3 {
         font-family: var(--mono);
         font-size: .95rem;
         font-weight: 600;
         color: var(--accent);
         margin: 28px 0 10px;
         text-transform: uppercase;
         letter-spacing: .08em;
      }

      #md-output p {
         margin-bottom: 1.1em;
         color: var(--text);
      }

      #md-output a {
         color: var(--accent);
         text-decoration: underline;
         text-underline-offset: 3px;
      }

      #md-output strong {
         color: var(--text-strong);
         font-weight: 600;
      }

      #md-output em {
         font-style: italic;
         color: var(--text-strong);
         opacity: .85;
      }

      #md-output ul,
      #md-output ol {
         padding-left: 1.5em;
         margin-bottom: 1.1em;
      }

      #md-output li {
         margin-bottom: .35em;
      }

      #md-output li::marker {
         color: var(--accent);
      }

      #md-output blockquote {
         border-left: 3px solid var(--accent);
         background: var(--surface2);
         margin: 24px 0;
         padding: 14px 20px;
         border-radius: 0 var(--radius) var(--radius) 0;
         font-style: italic;
         color: var(--text-muted);
      }

      #md-output code {
         font-family: var(--mono);
         font-size: .8em;
         background: var(--surface2);
         color: var(--accent);
         padding: 2px 6px;
         border-radius: 4px;
         border: 1px solid var(--border);
      }

      #md-output pre {
         background: #1a1b26;
         border: 1px solid var(--border);
         border-radius: var(--radius);
         padding: 20px 22px;
         margin: 20px 0;
         overflow-x: auto;
      }

      #md-output pre code {
         background: none;
         border: none;
         padding: 0;
         font-size: .82rem;
         color: var(--text);
         line-height: 1.7;
      }

      /* ── Syntax highlight overrides (Atom One Dark) ── */
      #md-output pre code .hljs-comment,
      #md-output pre code .hljs-quote {
         color: #5c6370;
         font-style: italic;
      }

      #md-output pre code .hljs-keyword,
      #md-output pre code .hljs-selector-tag,
      #md-output pre code .hljs-built_in,
      #md-output pre code .hljs-type,
      #md-output pre code .hljs-literal {
         color: #c678dd;
      }

      #md-output pre code .hljs-string,
      #md-output pre code .hljs-title,
      #md-output pre code .hljs-section,
      #md-output pre code .hljs-attribute,
      #md-output pre code .hljs-template-tag,
      #md-output pre code .hljs-template-variable {
         color: #98c379;
      }

      #md-output pre code .hljs-number,
      #md-output pre code .hljs-variable,
      #md-output pre code .hljs-constant {
         color: #d19a66;
      }

      #md-output pre code .hljs-attr,
      #md-output pre code .hljs-selector-class {
         color: #e5c07b;
      }

      #md-output pre code .hljs-function .hljs-title,
      #md-output pre code .hljs-class .hljs-title {
         color: #61afef;
      }

      #md-output pre code .hljs-params {
         color: #abb2bf;
      }

      #md-output pre code .hljs-punctuation {
         color: #abb2bf;
      }

      #md-output hr {
         border: none;
         border-top: 1px solid var(--border);
         margin: 36px 0;
      }

      #md-output table {
         width: 100%;
         border-collapse: collapse;
         margin: 24px 0;
         font-size: .9rem;
         font-family: var(--mono);
      }

      #md-output th {
         background: var(--surface2);
         color: var(--accent);
         padding: 10px 14px;
         text-align: left;
         border: 1px solid var(--border);
         font-weight: 600;
         font-size: .75rem;
         letter-spacing: .06em;
         text-transform: uppercase;
      }

      #md-output td {
         padding: 10px 14px;
         border: 1px solid var(--border);
         color: var(--text);
      }

      #md-output tr:hover td {
         background: var(--surface2);
      }

      #md-output img {
         max-width: 100%;
         border-radius: var(--radius);
         border: 1px solid var(--border);
         margin: 16px 0;
      }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar {
         width: 6px;
      }

      ::-webkit-scrollbar-track {
         background: transparent;
      }

      ::-webkit-scrollbar-thumb {
         background: var(--border);
         border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
         background: var(--text-muted);
      }

      /* ── Responsive ── */
      @media (max-width: 768px) {
         .topbar {
            display: flex;
         }

         .layout {
            padding-top: var(--header-h);
         }

         .sidebar {
            position: fixed;
            top: var(--header-h);
            bottom: 0;
            left: 0;
            z-index: 160;
            transform: translateX(-100%);
            width: min(var(--sidebar-w), 80vw);
         }

         .sidebar.open {
            transform: translateX(0);
         }

         .overlay {
            display: block;
         }

         .content-wrap {
            padding: 32px 22px 60px;
         }

         #md-output h1 {
            font-size: 2rem;
         }
      }

      @media (max-width: 480px) {
         .content-wrap {
            padding: 24px 16px 50px;
         }

         #md-output h1 {
            font-size: 1.7rem;
         }
      }
   </style>
</head>

<body>

   <!-- Mobile topbar -->
   <header class="topbar">
      <button class="burger" id="burger" aria-label="Toggle menu">
         <span></span><span></span><span></span>
      </button>
      <span class="topbar-title">Expo - React Native</span>
   </header>

   <!-- Overlay for mobile -->
   <div class="overlay" id="overlay"></div>

   <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
         <div class="sidebar-logo">
            <span class="dot"></span>
            <a href="/index.html" class="home-link">
               Home
            </a>
         </div>
         <div class="sidebar-section">General</div>

         <nav id="nav">
            <a class="nav-link" data-src="pages/essential-cli-commands.md" href="#">
               <span class="icon">◈</span> Essential CLI Commands
            </a>
            <a class="nav-link" data-src="pages/multiple-nodejs-apps-on-vps.md" href="#">
               <span class="icon">◈</span> Multiple Node.js Apps on VPS
            </a>
         </nav>

         <div class="sidebar-footer">
            Expo · React Native
         </div>
      </aside>

      <!-- Main -->
      <main class="main">
         <div class="content-wrap">
            <div class="loader" id="loader"></div>
            <div id="md-output">
               <div class="placeholder">
                  <span class="big">◈</span>
                  <span>Select a page from the sidebar</span>
               </div>
            </div>
         </div>
      </main>
   </div>

   <script>
      // Register "env" as alias for "ini" (KEY=value syntax)
      if (hljs) {
         const iniLang = hljs.getLanguage('ini');
         if (iniLang) hljs.registerLanguage('env', () => iniLang);
      }

      // ── Configure marked to generate heading IDs ──
      function slugify(text) {
         return text
            .toLowerCase()
            .replace(/[^\w]+/g, '-')
            .replace(/^-+|-+$/g, '');
      }

      const renderer = new marked.Renderer();
      renderer.heading = function (text, depth) {
         const id = slugify(text);
         return `<h${depth} id="${id}">${text}</h${depth}>\n`;
      };
      marked.setOptions({ renderer });

      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const burger = document.getElementById('burger');
      const output = document.getElementById('md-output');
      const loader = document.getElementById('loader');
      const navLinks = document.querySelectorAll('.nav-link');

      // ── Sidebar toggle (mobile) ──
      function openSidebar() {
         sidebar.classList.add('open');
         overlay.classList.add('visible');
         burger.classList.add('open');
      }
      function closeSidebar() {
         sidebar.classList.remove('open');
         overlay.classList.remove('visible');
         burger.classList.remove('open');
      }
      burger.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
      overlay.addEventListener('click', closeSidebar);

      // ── Sub-nav toggle ──
      function toggleSubNav(btn) {
         btn.classList.toggle('open');
         const sub = btn.nextElementSibling;
         if (sub && sub.classList.contains('sub-nav')) {
            sub.classList.toggle('open');
         }
      }

      // ── Load & render markdown via fetch ──
      async function loadPage(src, linkEl, anchorId) {
         // Active state
         navLinks.forEach(l => l.classList.remove('active'));
         linkEl.classList.add('active');

         // Loading indicator
         output.innerHTML = '';
         loader.style.display = 'block';

         try {
            const res = await fetch(src);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const md = await res.text();
            loader.style.display = 'none';
            output.innerHTML = marked.parse(md);
            // Apply syntax highlighting to code blocks
            output.querySelectorAll('pre code').forEach(block => {
               hljs.highlightElement(block);
            });
            // Scroll to anchor if provided, otherwise scroll to top
            if (anchorId) {
               scrollToAnchor(anchorId);
            } else {
               document.querySelector('.main').scrollTo({ top: 0, behavior: 'smooth' });
            }
         } catch (err) {
            loader.style.display = 'none';
            output.innerHTML = `
          <div class="placeholder">
            <span class="big">✕</span>
            <span>Could not load <code>${src}</code></span>
            <span style="font-size:.75rem;opacity:.5">${err.message}</span>
          </div>`;
         }

         closeSidebar();
      }

      // ── Nav click handlers ──
      navLinks.forEach(link => {
         link.addEventListener('click', e => {
            e.preventDefault();
            loadPage(link.dataset.src, link);
         });
      });

      // ── Handle clicks on internal anchor links within rendered markdown ──
      output.addEventListener('click', e => {
         const anchor = e.target.closest('a[href^="#"]');
         if (anchor) {
            e.preventDefault();
            const id = anchor.getAttribute('href').slice(1);
            // Update the URL hash without triggering hashchange
            history.replaceState(null, '', '#' + id);
            scrollToAnchor(id);
         }
      });

      // ── Auto-load from URL hash ──
      function loadFromHash() {
         const hash = location.hash.replace('#', '');
         if (hash) {
            // Check if hash contains a page source with optional anchor (e.g. "pages/expo-react-native-notes.md#1-project-setup")
            const pageMatch = hash.match(/^([^#]+?\.md)(?:#(.+))?$/);
            if (pageMatch) {
               const pageSrc = pageMatch[1];
               const anchorId = pageMatch[2] || null;
               const linkEl = [...navLinks].find(l => l.dataset.src === pageSrc);
               if (linkEl) { loadPage(pageSrc, linkEl, anchorId); return; }
            }
            // Otherwise, treat it as an anchor within the currently loaded page
            scrollToAnchor(hash);
            return;
         }
         // Default: load first page
         const first = navLinks[0];
         if (first) loadPage(first.dataset.src, first);
      }

      // ── Scroll to a heading anchor within the rendered markdown ──
      function scrollToAnchor(id) {
         // Wait a tick for the DOM to settle if the page just loaded
         setTimeout(() => {
            const el = document.getElementById(id);
            if (el) {
               el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
         }, 50);
      }

      // Update hash on page navigation
      navLinks.forEach(link => {
         link.addEventListener('click', () => {
            history.replaceState(null, '', '#' + link.dataset.src);
         });
      });

      loadFromHash();
      window.addEventListener('hashchange', loadFromHash);
   </script>
</body>

</html>
